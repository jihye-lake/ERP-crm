name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 윈도우에서 커밋하면 실행 권한이 빠질 수 있어서
      - run: chmod +x mvnw

      # GitHub 러너에는 Docker가 있어서 Testcontainers(PostgreSQL) 통합 테스트까지 같이 돈다
      - name: Build & Test
        run: ./mvnw -B verify

      - name: Docker image build
        run: docker build -t erp-crm:ci .

      - name: 테스트 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
