spring:
  application:
    name: erp-crm

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}   # DB 없이 화면만 볼 때는 h2

  thymeleaf:
    cache: false

server:
  servlet:
    session:
      timeout: 60m        # 원본 ASP Session.Timeout = 60(분)

# 통계(/statistics) "연간 목표 대비 달성률" 게이지 기준 금액 (원)
erp:
  annual-target-amount: ${ERP_ANNUAL_TARGET:300000000}

---
# ----------------------------------------------------------------------------
# postgres : 기본 프로필
#   접속 정보는 환경변수로 덮어쓸 수 있음 (docker compose에서는 compose 파일 값 사용)
#   스키마/시드는 Flyway(db/migration)로 관리
# ----------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erp_crm}
    username: ${DB_USERNAME:erp_user}
    password: ${DB_PASSWORD:erp_password}
  jpa:
    hibernate:
      ddl-auto: none       # 스키마는 Flyway가 관리
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never

---
# ----------------------------------------------------------------------------
# h2 : DB 설치 없이 바로 띄워보는 용도 (앱 끄면 데이터 사라짐)
#   실행: --spring.profiles.active=h2
#   마이그레이션 SQL이 PostgreSQL 문법이라 Flyway는 끄고 H2용 스키마로 초기화
# ----------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:erp;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      data-locations:
        - classpath:db/migration/V2__demo_seed.sql
        - classpath:schema-h2-v4-data.sql   # 시드의 옛 프로젝트코드를 새 형식으로 변환 (V4와 동일 규칙)
        - classpath:schema-h2-v5-data.sql   # Kcode 제거 + No 번호 부여 (V5와 동일 규칙)
        - classpath:db/migration/V6__client_master.sql   # 클라이언트 마스터 (H2 호환 문법이라 그대로 실행)
      encoding: UTF-8      # Windows + Java 17 기본 문자셋이 MS949라 명시 안 하면 시드 한글 깨짐
  h2:
    console:
      enabled: true        # http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:erp)
