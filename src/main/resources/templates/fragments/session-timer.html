<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 원본 index.asp / monitor.asp / DirectCost 화면 하단의 세션 만료 카운트다운 + 연장 버튼 -->
<div th:fragment="markup" class="session-pill">
    <i class="fa-regular fa-clock"></i>
    <span id="session-timer"></span>
    <button type="button" class="btn btn-primary" id="sessionExtend">연장</button>
</div>

<div th:fragment="script(timeoutSeconds)">
    <script th:inline="javascript">
        /*<![CDATA[*/
        $(document).ready(function () {
            $("#sessionExtend").click(function () {
                $.ajax({
                    url: '/session/extend',
                    type: 'POST',
                    success: function () {
                        alert("세션 시간이 연장되었습니다.");
                        location.reload();
                    },
                    error: function () {
                        alert("세션 연장 실패.");
                    }
                });
            });
        });

        let remainingTime = /*[[${timeoutSeconds}]]*/ 3600;
        var sessionOver = false;

        function formatTime(seconds) {
            let hours = Math.floor(seconds / 3600);
            let minutes = Math.floor((seconds % 3600) / 60);
            let sec = seconds % 60;
            return hours + "시간 " + minutes + "분 " + sec + "초";
        }

        function updateCountdown() {
            if (remainingTime <= 0 && sessionOver === false) {
                document.getElementById("session-timer").innerText = "세션이 만료되었습니다.";
                alert("세션이 만료되었습니다.\n로그인 페이지로 이동합니다.");
                sessionOver = true;
                location.href = '/login?expired=1';
                return;
            } else if (remainingTime <= 300 && sessionOver === false) {
                if (confirm("자동 로그아웃까지 5분 남았습니다. 세션을 연장하시겠습니까?")) {
                    $("#sessionExtend").trigger("click");
                    sessionOver = true;
                    return;
                } else {
                    sessionOver = true;
                }
            }

            document.getElementById("session-timer").innerText = "자동 로그아웃 시간 : " + formatTime(remainingTime);
            remainingTime--;
        }

        if (sessionOver === false) {
            setInterval(updateCountdown, 1000);
        }
        /*]]>*/
    </script>
</div>

</body>
</html>
