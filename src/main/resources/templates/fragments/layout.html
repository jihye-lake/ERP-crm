<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width"/>
    <meta name="robots" content="none"/>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <title th:text="${title}">Nexora ERP</title>
</head>

<!--/* 인증 후 화면 공통 좌측 사이드바. currentAdmin / canManageCost 는 호출하는 페이지의 모델에서 그대로 상속됩니다. */-->
<body>
<aside th:fragment="sidebar(activePage)" class="app-sidebar">
    <div class="app-brand">
        <span class="app-brand-mark">N</span>
        <span class="app-brand-text">Nexora<small>PROJECT ERP</small></span>
    </div>

    <nav class="app-nav">
        <a th:href="${currentAdmin.role.name() == 'VIEWER'} ? '/monitor' : '/'" class="app-nav-link" th:classappend="${activePage == 'dashboard'} ? 'active'">
            <i class="fa-solid fa-gauge"></i> 대시보드
        </a>
        <a th:if="${canManageCost}" href="/statistics" class="app-nav-link" th:classappend="${activePage == 'statistics'} ? 'active'">
            <i class="fa-solid fa-chart-column"></i> 통계
        </a>
    </nav>

    <div class="app-sidebar-footer">
        <div class="app-user-chip">
            <span class="app-user-avatar"><i class="fa-solid fa-circle-user"></i></span>
            <div class="app-user-meta">
                <div class="app-user-name" th:text="${currentAdmin.displayName}">관리자</div>
                <div class="app-user-role-row" th:switch="${currentAdmin.role.name()}">
                    <span th:case="'ADMIN'" class="role-badge role-badge-admin" th:text="${currentAdmin.role.displayLabel}"></span>
                    <span th:case="'EDITOR'" class="role-badge role-badge-editor" th:text="${currentAdmin.role.displayLabel}"></span>
                    <span th:case="*" class="role-badge role-badge-viewer" th:text="${currentAdmin.role.displayLabel}"></span>
                </div>
            </div>
        </div>
        <form method="post" action="/logout">
            <button type="submit" class="app-logout-btn" onclick="return confirm('로그아웃 하시겠습니까?');">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> 로그아웃
            </button>
        </form>
    </div>
</aside>
</body>
</html>
