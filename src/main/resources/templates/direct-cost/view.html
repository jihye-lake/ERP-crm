<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('프로젝트별 직접비 항목 (조회)')}"></head>
<body>

<div class="doc-screen">
    <div class="doc-card">
        <div class="doc-header">
            <h1 class="doc-title">프로젝트별 직접비 항목</h1>
            <span class="doc-total" th:text="'총 직접비 : ￦ ' + ${#numbers.formatInteger(total, 0)}"></span>
        </div>
        <div class="doc-subtitle">프로젝트명 : (<span th:text="${project.projectCode}"></span>) <span th:text="${project.title}"></span></div>

        <div class="table-container">
            <table class="table table-bordered">
                <colgroup><col width="20%"><col width="15%"><col width="10%"><col width="7%"><col width="15%"><col width="*"></colgroup>
                <thead>
                    <tr>
                        <th class="v_mid">항목</th>
                        <th class="v_mid">단가</th>
                        <th class="v_mid">투여량</th>
                        <th class="v_mid">일자</th>
                        <th class="v_mid">금액</th>
                        <th class="v_mid">비고</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${form.items}" th:class="${item.highlightClass}">
                        <td class="v_mid" th:text="${item.label}"></td>
                        <td class="v_mid" th:text="${item.unitPrice}"></td>
                        <td class="v_mid" th:text="${item.quantity}"></td>
                        <td class="v_mid" th:text="${item.days}"></td>
                        <td class="v_mid text-end" th:text="${item.amount != null and item.amount.signum() != 0 ? '￦ ' + #numbers.formatInteger(item.amount, 0) : ''}"></td>
                        <td class="v_mid" th:text="${item.note}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="row mt-3">
            <div class="col col-md-9">
                <button type="button" class="btn btn-primary w-100" onclick="window.close();">돌아가기</button>
            </div>
            <div class="text-end col col-md-3">
                <div th:replace="~{fragments/session-timer :: markup}"></div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/session-timer :: script(${timeoutSeconds})}"></div>

</body>
</html>
